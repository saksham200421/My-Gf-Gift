<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-900: #1f2436;
        --ink-700: #3c4460;
        --ink-500: #6a738d;
        --pink-100: #fff2f7;
        --pink-300: #f4a6be;
        --pink-500: #e06b8f;
        --blue-200: #dfe9ff;
        --blue-400: #8aa6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        min-height: 100vh;
        color: var(--ink-900);
        background-color: #fff0f6;
        background-image:
          radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.7) 0 12%, transparent 13%),
          radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.7) 0 12%, transparent 13%),
          radial-gradient(circle at 18% 72%, rgba(255, 255, 255, 0.6) 0 10%, transparent 11%),
          radial-gradient(circle at 84% 76%, rgba(255, 255, 255, 0.6) 0 10%, transparent 11%),
          radial-gradient(circle at 52% 40%, rgba(255, 255, 255, 0.45) 0 8%, transparent 9%),
          radial-gradient(circle at 42% 62%, rgba(255, 255, 255, 0.45) 0 8%, transparent 9%),
          linear-gradient(160deg, #ffe6ef 0%, #f4f1ff 55%, #e7f1ff 100%);
      }

      .wrap {
        min-height: 100vh;
        width: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 32px 16px;
      }

      .audio-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink-900);
        box-shadow: 0 12px 24px rgba(55, 81, 141, 0.18);
      }

      .header {
        display: grid;
        gap: 12px;
      }

      .badge {
        width: max-content;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.85);
        color: var(--ink-500);
      }

      h1 {
        margin: 0;
        font-family: "Playfair Display", "Times New Roman", serif;
        font-size: clamp(30px, 4vw, 44px);
      }

      p {
        margin: 0;
        font-size: 18px;
        color: var(--ink-700);
      }

      .card {
        display: grid;
        gap: 20px;
        align-items: center;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 28px;
        padding: 32px 28px;
        max-width: 520px;
        width: min(520px, 100%);
        box-shadow: 0 24px 60px rgba(224, 107, 143, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .question {
        display: grid;
        gap: 12px;
      }

      .actions {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        position: relative;
        z-index: 2;
      }

      .btn {
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(55, 81, 141, 0.18);
      }

      .btn-yes {
        background: #e06b8f;
        color: #fff6fb;
        position: relative;
        z-index: 2;
        box-shadow: 0 12px 24px rgba(224, 107, 143, 0.3);
      }

      .btn-no {
        position: fixed;
        left: 60vw;
        top: 60vh;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(224, 107, 143, 0.35);
        color: var(--ink-900);
        z-index: 3;
        transition: left 220ms ease, top 220ms ease, transform 0.2s ease;
      }

      .footer {
        text-align: center;
        color: var(--ink-500);
        font-size: 14px;
      }

      @media (max-width: 720px) {
        .wrap {
          padding: 32px 16px;
        }
      }
    </style>
  </head>
  <body>
    <audio id="bg-audio" autoplay loop>
      <source src="FILL_IN_SONG_FILE.mp3" type="audio/mpeg" />
    </audio>
    <button class="audio-toggle" id="audio-toggle" type="button">Mute</button>
    <main class="wrap">
      <section class="card">
        <span class="badge">Valentine 2026</span>
        <h1>Will you be my valentine?</h1>
        <p>
          I saved this page just for you. Every heartbeat says yes.
        </p>
        <div class="actions" id="actions">
          <button class="btn btn-yes" id="yes">Yes</button>
          <button class="btn btn-no" id="no">No</button>
        </div>
        <div class="footer">You are my favorite person.</div>
      </section>
    </main>

    <script>
      const noButton = document.getElementById("no");
      const yesButton = document.getElementById("yes");
      const audio = document.getElementById("bg-audio");
      const audioToggle = document.getElementById("audio-toggle");
      let lastMove = 0;

      const positionNoRightOfYes = () => {
        const yesRect = yesButton.getBoundingClientRect();
        const noRect = noButton.getBoundingClientRect();
        const padding = 12;
        const left = Math.min(
          window.innerWidth - noRect.width - padding,
          yesRect.right + 16
        );
        const top = Math.max(padding, yesRect.top + (yesRect.height - noRect.height) / 2);

        noButton.style.left = `${left}px`;
        noButton.style.top = `${top}px`;
      };

      const moveNoButton = () => {
        const noRect = noButton.getBoundingClientRect();
        const padding = 6;
        const maxX = Math.max(padding, window.innerWidth - noRect.width - padding);
        const maxY = Math.max(padding, window.innerHeight - noRect.height - padding);
        const nextX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
        const nextY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;

        noButton.style.left = `${nextX}px`;
        noButton.style.top = `${nextY}px`;
      };

      const handleChase = (event) => {
        const now = Date.now();
        if (now - lastMove < 140) {
          return;
        }

        const rect = noButton.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = event.clientX - centerX;
        const dy = event.clientY - centerY;
        const distance = Math.hypot(dx, dy);

        if (distance < 110) {
          lastMove = now;
          moveNoButton();
        }
      };

      window.addEventListener("pointermove", handleChase);
      window.addEventListener("pointerdown", moveNoButton);
      noButton.addEventListener("pointerenter", moveNoButton);
      noButton.addEventListener("focus", moveNoButton);
      yesButton.addEventListener("click", () => {
        yesButton.textContent = "Yay!";
        yesButton.style.background = "#e06b8f";
        yesButton.style.boxShadow = "0 12px 30px rgba(224, 107, 143, 0.35)";
      });

      audioToggle.addEventListener("click", () => {
        audio.muted = !audio.muted;
        audioToggle.textContent = audio.muted ? "Unmute" : "Mute";
      });

      window.addEventListener("resize", positionNoRightOfYes);
      window.requestAnimationFrame(() => {
        positionNoRightOfYes();
      });
    </script>
  </body>
</html>
