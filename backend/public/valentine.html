<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-900: #1f2436;
        --ink-700: #3c4460;
        --ink-500: #6a738d;
        --pink-100: #fff2f7;
        --pink-300: #f4a6be;
        --pink-500: #e06b8f;
        --blue-200: #dfe9ff;
        --blue-400: #8aa6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        min-height: 100vh;
        color: var(--ink-900);
        background-color: #fff0f6;
        background-image:
          radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.7) 0 12%, transparent 13%),
          radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.7) 0 12%, transparent 13%),
          radial-gradient(circle at 18% 72%, rgba(255, 255, 255, 0.6) 0 10%, transparent 11%),
          radial-gradient(circle at 84% 76%, rgba(255, 255, 255, 0.6) 0 10%, transparent 11%),
          radial-gradient(circle at 52% 40%, rgba(255, 255, 255, 0.45) 0 8%, transparent 9%),
          radial-gradient(circle at 42% 62%, rgba(255, 255, 255, 0.45) 0 8%, transparent 9%),
          linear-gradient(160deg, #ffe6ef 0%, #f4f1ff 55%, #e7f1ff 100%);
        overflow: hidden;
      }

      .hearts-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .wrap {
        min-height: 100vh;
        width: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 32px 16px;
        position: relative;
        z-index: 1;
      }

      .audio-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink-900);
        box-shadow: 0 12px 24px rgba(55, 81, 141, 0.18);
        z-index: 3;
      }

      .landing-link {
        position: fixed;
        top: 20px;
        left: 20px;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink-900);
        box-shadow: 0 12px 24px rgba(55, 81, 141, 0.18);
        z-index: 3;
      }

      .header {
        display: grid;
        gap: 12px;
      }

      .badge {
        width: max-content;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.85);
        color: var(--ink-500);
      }

      h1 {
        margin: 0;
        font-family: "Playfair Display", "Times New Roman", serif;
        font-size: clamp(30px, 4vw, 44px);
      }

      p {
        margin: 0;
        font-size: 18px;
        color: var(--ink-700);
      }

      .card {
        display: grid;
        gap: 20px;
        align-items: center;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 28px;
        padding: 32px 28px;
        max-width: 520px;
        width: min(520px, 100%);
        box-shadow: 0 24px 60px rgba(224, 107, 143, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .question {
        display: grid;
        gap: 12px;
      }

      .actions {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        position: relative;
        z-index: 2;
      }

      .btn {
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(55, 81, 141, 0.18);
      }

      .btn-yes {
        background: #e06b8f;
        color: #fff6fb;
        position: relative;
        z-index: 2;
        box-shadow: 0 12px 24px rgba(224, 107, 143, 0.3);
      }

      .btn-no {
        position: fixed;
        left: 60vw;
        top: 60vh;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(224, 107, 143, 0.35);
        color: var(--ink-900);
        z-index: 3;
        transition: left 220ms ease, top 220ms ease, transform 0.2s ease;
      }

      .footer {
        text-align: center;
        color: var(--ink-500);
        font-size: 14px;
      }

      @media (max-width: 720px) {
        .wrap {
          padding: 32px 16px;
        }
      }
    </style>
  </head>
  <body>
    <canvas class="hearts-bg" id="hearts-bg" aria-hidden="true"></canvas>
    <audio id="bg-audio" autoplay loop>
      <source src="FILL_IN_SONG_FILE.mp3" type="audio/mpeg" />
    </audio>
    <a class="landing-link" id="landing-link" href="/">Back to landing</a>
    <button class="audio-toggle" id="audio-toggle" type="button">Mute</button>
    <main class="wrap">
      <section class="card">
        <span class="badge">14th Feb 2026</span>
        <h1>Myyyy loveeeeii Myyy meowww meowwww Will you be my valentine?</h1>
        <p>
          I this place just for you & me. My Heart beats just for you.
        </p>
        <div class="actions" id="actions">
          <button class="btn btn-yes" id="yes">Yes</button>
          <button class="btn btn-no" id="no">No</button>
        </div>
        <div class="footer">You are my preciouss cuppcakeee donutttttt.</div>
      </section>
    </main>

    <script>
      const noButton = document.getElementById("no");
      const yesButton = document.getElementById("yes");
      const audio = document.getElementById("bg-audio");
      const audioToggle = document.getElementById("audio-toggle");
      const landingLink = document.getElementById("landing-link");
      const heartsCanvas = document.getElementById("hearts-bg");
      const heartsCtx = heartsCanvas.getContext("2d");
      let lastMove = 0;
      const fallingHearts = [];
      const shootingHearts = [];
      const diagonalShootingHearts = [];
      const lingeringTrails = [];
      const heartPalette = [
        "#ff5ea8",
        "#ff7fb0",
        "#ff9ec7",
        "#ff6f91",
        "#ff9671",
        "#f38fff",
        "#9db8ff",
        "#7fd8ff",
        "#b8ff9d",
        "#ffd86b",
      ];

      let viewportWidth = window.innerWidth;
      let viewportHeight = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const pickHeartColor = () => {
        if (Math.random() < 0.6) {
          return heartPalette[Math.floor(Math.random() * heartPalette.length)];
        }
        const hue = Math.floor(Math.random() * 360);
        const sat = 75 + Math.floor(Math.random() * 20);
        const light = 60 + Math.floor(Math.random() * 15);
        return `hsl(${hue} ${sat}% ${light}%)`;
      };

      const resizeHeartsCanvas = () => {
        viewportWidth = window.innerWidth;
        viewportHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        heartsCanvas.width = Math.floor(viewportWidth * dpr);
        heartsCanvas.height = Math.floor(viewportHeight * dpr);
        heartsCanvas.style.width = `${viewportWidth}px`;
        heartsCanvas.style.height = `${viewportHeight}px`;
        heartsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      const createFallingHeart = () => {
        fallingHearts.push({
          x: Math.random() * viewportWidth,
          y: -30 - Math.random() * 100,
          size: 8 + Math.random() * 16,
          vx: -0.6 + Math.random() * 1.2,
          vy: 0.8 + Math.random() * 1.7,
          rotation: Math.random() * Math.PI * 2,
          vr: (-0.02 + Math.random() * 0.04),
          alpha: 0.55 + Math.random() * 0.35,
          color: pickHeartColor(),
        });
      };

      const createShootingHeart = () => {
        const fromLeft = Math.random() > 0.5;
        shootingHearts.push({
          x: fromLeft ? -40 : viewportWidth + 40,
          y: viewportHeight * (0.45 + Math.random() * 0.45),
          size: 10 + Math.random() * 12,
          vx: fromLeft ? 3 + Math.random() * 3 : -3 - Math.random() * 3,
          vy: -4.8 - Math.random() * 2.5,
          gravity: 0.035 + Math.random() * 0.02,
          rotation: Math.random() * Math.PI * 2,
          vr: -0.05 + Math.random() * 0.1,
          alpha: 0.75 + Math.random() * 0.2,
          color: pickHeartColor(),
          life: 0,
          maxLife: 170 + Math.random() * 80,
        });
      };

      const createDiagonalShootingHeart = () => {
        const fromLeft = Math.random() > 0.5;
        const startY = 20 + Math.random() * (viewportHeight * 0.35);
        const vx = fromLeft ? 5.2 + Math.random() * 2.6 : -5.2 - Math.random() * 2.6;
        const vy = 2.8 + Math.random() * 2.4;
        diagonalShootingHearts.push({
          x: fromLeft ? -70 : viewportWidth + 70,
          y: startY,
          vx,
          vy,
          size: 10 + Math.random() * 8,
          life: 0,
          maxLife: 1100 + Math.random() * 400,
          color: pickHeartColor(),
          alpha: 0.95,
          rotation: Math.atan2(vy, vx) + Math.PI / 2,
          vr: -0.03 + Math.random() * 0.06,
        });
      };

      const drawHeart = (x, y, size, color, alpha, rotation) => {
        heartsCtx.save();
        heartsCtx.translate(x, y);
        heartsCtx.rotate(rotation);
        heartsCtx.scale(size / 20, size / 20);
        heartsCtx.globalAlpha = alpha;
        heartsCtx.fillStyle = color;
        heartsCtx.beginPath();
        heartsCtx.moveTo(0, 8.5);
        heartsCtx.bezierCurveTo(0, 2.2, -4.6, -2.6, -10.2, -2.6);
        heartsCtx.bezierCurveTo(-15.6, -2.6, -18.8, 1.8, -18.8, 6.6);
        heartsCtx.bezierCurveTo(-18.8, 12.2, -14.4, 15.6, -8.4, 19.8);
        heartsCtx.bezierCurveTo(-4.4, 22.5, -1.6, 24.8, 0, 27.2);
        heartsCtx.bezierCurveTo(1.6, 24.8, 4.4, 22.5, 8.4, 19.8);
        heartsCtx.bezierCurveTo(14.4, 15.6, 18.8, 12.2, 18.8, 6.6);
        heartsCtx.bezierCurveTo(18.8, 1.8, 15.6, -2.6, 10.2, -2.6);
        heartsCtx.bezierCurveTo(4.6, -2.6, 0, 2.2, 0, 8.5);
        heartsCtx.closePath();
        heartsCtx.fill();
        heartsCtx.restore();
      };

      const drawShootingTrail = (heart) => {
        heartsCtx.save();
        heartsCtx.globalAlpha = Math.max(0.12, heart.alpha * 0.25);
        heartsCtx.strokeStyle = heart.color;
        heartsCtx.lineWidth = Math.max(1, heart.size * 0.18);
        heartsCtx.lineCap = "round";
        heartsCtx.beginPath();
        heartsCtx.moveTo(heart.x, heart.y);
        heartsCtx.lineTo(heart.x - heart.vx * 5, heart.y - heart.vy * 5);
        heartsCtx.stroke();
        heartsCtx.restore();
      };

      const addLingeringTrail = (heart) => {
        lingeringTrails.push({
          x: heart.x - heart.vx * 1.2,
          y: heart.y - heart.vy * 1.2,
          size: Math.max(4, heart.size * 0.46),
          color: heart.color,
          alpha: 0.5,
          life: 0,
          maxLife: 2100 + Math.random() * 1300,
          rotation: heart.rotation,
        });
      };

      const drawLingeringTrails = (delta) => {
        for (let i = lingeringTrails.length - 1; i >= 0; i -= 1) {
          const trail = lingeringTrails[i];
          trail.life += delta;
          trail.alpha = Math.max(0, 1 - trail.life / trail.maxLife) * 0.35;

          drawHeart(
            trail.x,
            trail.y,
            trail.size,
            trail.color,
            trail.alpha,
            trail.rotation
          );

          if (trail.life >= trail.maxLife) {
            lingeringTrails.splice(i, 1);
          }
        }
      };

      const drawDiagonalHeartTrail = (heart) => {
        heartsCtx.save();
        heartsCtx.globalAlpha = Math.max(0.08, heart.alpha * 0.22);
        heartsCtx.strokeStyle = heart.color;
        heartsCtx.lineWidth = Math.max(1, heart.size * 0.16);
        heartsCtx.lineCap = "round";
        heartsCtx.beginPath();
        heartsCtx.moveTo(heart.x, heart.y);
        heartsCtx.lineTo(heart.x - heart.vx * 7.5, heart.y - heart.vy * 7.5);
        heartsCtx.stroke();
        heartsCtx.restore();
      };

      let lastFrame = performance.now();
      let fallSpawnTimer = 0;
      let shootSpawnTimer = 0;
      let starSpawnTimer = 0;

      const animateHearts = (time) => {
        const delta = Math.min(33, time - lastFrame);
        lastFrame = time;

        heartsCtx.clearRect(0, 0, viewportWidth, viewportHeight);

        fallSpawnTimer += delta;
        shootSpawnTimer += delta;
        starSpawnTimer += delta;

        drawLingeringTrails(delta);

        while (fallSpawnTimer > 110) {
          fallSpawnTimer -= 110;
          createFallingHeart();
        }

        if (shootSpawnTimer > 650 + Math.random() * 450) {
          shootSpawnTimer = 0;
          createShootingHeart();
        }

        if (starSpawnTimer > 950 + Math.random() * 1400) {
          starSpawnTimer = 0;
          createDiagonalShootingHeart();
        }

        for (let i = fallingHearts.length - 1; i >= 0; i -= 1) {
          const heart = fallingHearts[i];
          heart.x += heart.vx * (delta / 16.67);
          heart.y += heart.vy * (delta / 16.67);
          heart.rotation += heart.vr * (delta / 16.67);

          drawHeart(heart.x, heart.y, heart.size, heart.color, heart.alpha, heart.rotation);

          if (
            heart.y > viewportHeight + 40 ||
            heart.x < -50 ||
            heart.x > viewportWidth + 50
          ) {
            fallingHearts.splice(i, 1);
          }
        }

        for (let i = shootingHearts.length - 1; i >= 0; i -= 1) {
          const heart = shootingHearts[i];
          heart.life += delta;
          heart.vy += heart.gravity * (delta / 16.67);
          heart.x += heart.vx * (delta / 16.67);
          heart.y += heart.vy * (delta / 16.67);
          heart.rotation += heart.vr * (delta / 16.67);
          heart.alpha = Math.max(0, 1 - heart.life / heart.maxLife);

          drawShootingTrail(heart);
          drawHeart(
            heart.x,
            heart.y,
            heart.size,
            heart.color,
            heart.alpha,
            heart.rotation
          );

          if (
            heart.life >= heart.maxLife ||
            heart.y > viewportHeight + 60 ||
            heart.x < -80 ||
            heart.x > viewportWidth + 80
          ) {
            shootingHearts.splice(i, 1);
          }
        }

        for (let i = diagonalShootingHearts.length - 1; i >= 0; i -= 1) {
          const heart = diagonalShootingHearts[i];
          heart.life += delta;
          heart.x += heart.vx * (delta / 16.67);
          heart.y += heart.vy * (delta / 16.67);
          heart.rotation += heart.vr * (delta / 16.67);
          heart.alpha = Math.max(0, 1 - heart.life / heart.maxLife);

          addLingeringTrail(heart);
          drawDiagonalHeartTrail(heart);
          drawHeart(
            heart.x,
            heart.y,
            heart.size,
            heart.color,
            heart.alpha,
            heart.rotation
          );

          if (
            heart.life >= heart.maxLife ||
            heart.y > viewportHeight + 60 ||
            heart.x < -120 ||
            heart.x > viewportWidth + 120
          ) {
            diagonalShootingHearts.splice(i, 1);
          }
        }

        window.requestAnimationFrame(animateHearts);
      };

      const positionNoRightOfYes = () => {
        const yesRect = yesButton.getBoundingClientRect();
        const noRect = noButton.getBoundingClientRect();
        const padding = 12;
        const left = Math.min(
          window.innerWidth - noRect.width - padding,
          yesRect.right + 16
        );
        const top = Math.max(padding, yesRect.top + (yesRect.height - noRect.height) / 2);

        noButton.style.left = `${left}px`;
        noButton.style.top = `${top}px`;
      };

      const moveNoButton = () => {
        const noRect = noButton.getBoundingClientRect();
        const padding = 6;
        const maxX = Math.max(padding, window.innerWidth - noRect.width - padding);
        const maxY = Math.max(padding, window.innerHeight - noRect.height - padding);
        const nextX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
        const nextY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;

        noButton.style.left = `${nextX}px`;
        noButton.style.top = `${nextY}px`;
      };

      const handleChase = (event) => {
        const now = Date.now();
        if (now - lastMove < 140) {
          return;
        }

        const rect = noButton.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = event.clientX - centerX;
        const dy = event.clientY - centerY;
        const distance = Math.hypot(dx, dy);

        if (distance < 110) {
          lastMove = now;
          moveNoButton();
        }
      };

      window.addEventListener("pointermove", handleChase);
      window.addEventListener("pointerdown", moveNoButton);
      noButton.addEventListener("pointerenter", moveNoButton);
      noButton.addEventListener("focus", moveNoButton);
      yesButton.addEventListener("click", () => {
        yesButton.textContent = "Yay!";
        yesButton.style.background = "#e06b8f";
        yesButton.style.boxShadow = "0 12px 30px rgba(224, 107, 143, 0.35)";
        const target = new URL("/", landingLink.href).toString();
        window.setTimeout(() => {
          window.location.href = target;
        }, 350);
      });

      audioToggle.addEventListener("click", () => {
        audio.muted = !audio.muted;
        audioToggle.textContent = audio.muted ? "Unmute" : "Mute";
      });

      if (document.referrer) {
        try {
          const referrerUrl = new URL(document.referrer);
          if (referrerUrl.protocol === "http:" || referrerUrl.protocol === "https:") {
            landingLink.href = referrerUrl.origin;
          }
        } catch (_) {
          landingLink.href = "/";
        }
      }

      window.addEventListener("resize", () => {
        positionNoRightOfYes();
        resizeHeartsCanvas();
      });
      window.requestAnimationFrame(() => {
        positionNoRightOfYes();
      });

      resizeHeartsCanvas();
      for (let i = 0; i < 24; i += 1) {
        createFallingHeart();
      }
      window.requestAnimationFrame(animateHearts);
    </script>
  </body>
</html>
